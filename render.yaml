services:
  - type: web
    name: recipe-scaler
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DAILY_PER_IP
        value: "10"
      - key: DAILY_GLOBAL
        value: "150"
